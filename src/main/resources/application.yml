server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: rent-gate
  datasource:
    url: ${RENT_GATE_DB_URL:jdbc:h2:file:./data/rent-gate;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${RENT_GATE_DB_PASSWORD:}
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      accept-float-as-int: false
  mvc:
    log-resolved-exception: false
