[env:esp01_1m]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.1m64.ld
lib_deps =
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -D RELAY_PIN=0
  -D RELAY_ACTIVE_LEVEL=0